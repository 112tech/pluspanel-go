# golangci-lint v2 — strict profile for the public Go client (same rules as control/).
version: "2"

run:
  # The generated file (~3 MB) is type-checked with the hand-written code; give it room.
  timeout: 15m
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - paralleltest
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - wrapcheck
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    gosec:
      severity: low
      confidence: low
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
        - .ErrorWithHeaders(
        - status.Error(
        - status.Errorf(
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T"
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: unused-parameter
  exclusions:
    generated: strict
    rules:
      # Tests use throwaway fixtures (DSNs, temp files, plain-http cookies) and call helpers
      # directly; production code keeps the full rule set.
      - path: _test\.go
        linters: [gosec, noctx, wrapcheck, contextcheck]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/112tech/pluspanel-go
  exclusions:
    generated: strict
